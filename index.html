<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5efe5"><title>منوی کافه رفیق</title><style>
:root{--bg:#f5efe5;--paper:#fffaf2;--ink:#38271d;--muted:#8c7764;--accent:#8a5b3d;--line:#e8dac8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}header{padding:34px 18px 24px;text-align:center;background:linear-gradient(135deg,#eadcc8,#f8f1e7);border-bottom:1px solid var(--line)}.brand{font-size:34px;font-weight:900}.sub{color:var(--muted);margin-top:9px;font-size:13px}.wrap{max-width:980px;margin:auto;padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 16px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--paper);color:var(--ink)}#search{flex:1;min-width:170px}.tabs{display:flex;gap:8px;overflow:auto;padding:5px 0 14px}.tab{white-space:nowrap;border-radius:30px;padding:9px 15px;cursor:pointer;background:#eee3d4;border:1px solid transparent}.tab.active,.primary{background:var(--accent);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}.item{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}.photo{height:145px;background:linear-gradient(135deg,#e9ddcd,#d7c1a6);display:grid;place-items:center;color:#886c51;font-size:42px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:13px}.name{font-weight:800}.desc{font-size:11px;color:var(--muted);margin-top:6px}.price{margin-top:12px;color:var(--accent);font-weight:900}footer{text-align:center;color:var(--muted);padding:28px;font-size:12px}button{cursor:pointer}.adminbar{display:flex;justify-content:flex-end;margin:14px 0}dialog{border:1px solid var(--line);border-radius:20px;background:var(--paper);color:var(--ink);width:min(620px,94vw);max-height:90vh;overflow:auto;padding:20px}dialog::backdrop{background:#21170f99}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}.formgrid input,.formgrid select{width:100%}.wide{grid-column:1/-1}.admin-list{display:grid;gap:8px;margin-top:14px}.admin-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.danger{color:#9d3930;border-color:#d7aaa5}.small{font-size:12px;color:var(--muted)}@media(max-width:520px){.brand{font-size:29px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><header><div class="brand">کافه رفیق</div><div class="sub">یه رفیق، یه فنجون قهوه، یه حال خوب</div></header><main class="wrap"><div id="status" class="small" style="text-align:center;padding:8px">در حال اتصال…</div><div class="toolbar"><input id="search" placeholder="جست‌وجوی نوشیدنی یا غذا…"></div><nav id="tabs" class="tabs"></nav><section id="items" class="grid"></section><div class="adminbar"><button id="adminBtn" class="primary">ورود مدیر / ویرایش منو</button></div></main><footer>منوی آنلاین کافه رفیق</footer>
<dialog id="login"><h3>ورود مدیر</h3><div class="formgrid"><label class="wide">ایمیل مدیر<input id="email" type="email" autocomplete="username"></label><label class="wide">رمز عبور<input id="password" type="password" autocomplete="current-password"></label></div><p id="loginError" class="small"></p><div class="toolbar"><button id="loginGo" class="primary">ورود</button><button id="loginClose">بستن</button></div></dialog>
<dialog id="admin"><h3>پنل مدیریت</h3><div class="toolbar"><button id="addBtn" class="primary">افزودن آیتم</button><button id="adminClose">خروج</button></div><div id="adminList" class="admin-list"></div></dialog>
<dialog id="editor"><h3 id="editorTitle">افزودن آیتم</h3><div class="formgrid"><label>نام آیتم<input id="eName"></label><label>قیمت به تومان<input id="ePrice" type="number" min="0"></label><label>دسته‌بندی<select id="eCat"></select></label><label>توضیح کوتاه<input id="eDesc"></label><label class="wide">عکس آیتم<input id="ePhoto" type="file" accept="image/*"></label><label class="wide"><span><input id="eAvailable" type="checkbox" checked style="width:auto"> موجود است</span></label></div><div class="toolbar"><button id="saveItem" class="primary">ذخیره</button><button id="cancelEdit">انصراف</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>
const $=id=>document.getElementById(id),cfg=window.RAFIGH_CONFIG||{};let db=null,products=[],categories=[],active='همه',editId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function status(s,ok=false){$('status').textContent=s;$('status').style.color=ok?'#39734b':'#8c7764'}
function renderTabs(){let names=['همه',...categories.map(c=>c.name)];$('tabs').innerHTML=names.map(n=>`<button class="tab ${active===n?'active':''}" data-cat="${esc(n)}">${esc(n)}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderTabs();renderItems()})}
function renderItems(){let q=$('search').value.trim().toLocaleLowerCase('fa');let rows=products.filter(p=>p.is_available&&(active==='همه'||p.categories?.name===active)&&(`${p.name} ${p.description||''}`).toLocaleLowerCase('fa').includes(q));$('items').innerHTML=rows.map(p=>`<article class="item"><div class="photo">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:'☕'}</div><div class="info"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||p.categories?.name||'')}</div><div class="price">${Number(p.price).toLocaleString('fa-IR')} تومان</div></div></article>`).join('')||'<p>موردی پیدا نشد.</p>'}
async function loadPublic(){if(!cfg.url||!cfg.anonKey){status('ابتدا فایل config.js را با اطلاعات پروژه تکمیل کنید.');return}db=window.supabase.createClient(cfg.url,cfg.anonKey);try{const [p,c]=await Promise.all([db.from('products').select('id,name,description,price,image_url,is_available,sort_order,categories(name)').eq('is_available',true).order('sort_order'),db.from('categories').select('id,name,sort_order').order('sort_order')]);if(p.error)throw p.error;if(c.error)throw c.error;products=p.data||[];categories=c.data||[];renderTabs();renderItems();status('منوی آنلاین به‌روز است',true)}catch(e){console.error(e);status('اتصال برقرار نشد؛ تنظیمات Supabase را بررسی کنید.')}}
$('search').oninput=renderItems;$('adminBtn').onclick=()=>{if(!db){alert('ابتدا اتصال را در config.js تنظیم کنید.');return}$('login').showModal()};$('loginClose').onclick=()=>$('login').close();$('loginGo').onclick=async()=>{const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent='ورود ناموفق بود؛ ایمیل و رمز را بررسی کنید.';return}$('login').close();$('admin').showModal();await loadAdmin()};
async function loadAdmin(){const {data,error}=await db.from('products').select('*,categories(name)').order('sort_order');if(error){alert('دریافت محصولات انجام نشد.');return}products=data||[];const {data:c}=await db.from('categories').select('*').order('sort_order');categories=c||[];renderAdmin();renderTabs();renderItems()}
function renderAdmin(){$('adminList').innerHTML=products.map(p=>`<div class="admin-row"><span><b>${esc(p.name)}</b><br><span class="small">${esc(p.categories?.name||'')} · ${Number(p.price).toLocaleString('fa-IR')} تومان · ${p.is_available?'موجود':'ناموجود'}</span></span><span class="actions"><button data-edit="${p.id}">ویرایش</button><button class="danger" data-del="${p.id}">حذف</button></span></div>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('این آیتم حذف شود؟')){const {error}=await db.from('products').delete().eq('id',b.dataset.del);if(error){alert('حذف انجام نشد؛ دسترسی دیتابیس را بررسی کنید.');return}await loadAdmin()}})}
$('adminClose').onclick=async()=>{$('admin').close();await db.auth.signOut()};$('addBtn').onclick=()=>openEditor(null);
function openEditor(id){editId=id;let p=id?products.find(x=>x.id===id):{name:'',price:'',category_id:categories[0]?.id,description:'',is_available:true};$('editorTitle').textContent=id?'ویرایش آیتم':'افزودن آیتم';$('eName').value=p.name;$('ePrice').value=p.price;$('eDesc').value=p.description||'';$('eCat').innerHTML=categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('eCat').value=p.category_id;$('eAvailable').checked=!!p.is_available;$('ePhoto').value='';$('editor').showModal()}
async function uploadPhoto(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg',path=crypto.randomUUID()+'.'+ext;const {error}=await db.storage.from('product-images').upload(path,file,{contentType:file.type});if(error)throw error;return db.storage.from('product-images').getPublicUrl(path).data.publicUrl}
$('saveItem').onclick=async()=>{const name=$('eName').value.trim(),price=Number($('ePrice').value),category_id=$('eCat').value;if(!name||!Number.isFinite(price)||price<=0||!category_id){alert('نام، قیمت و دسته‌بندی را کامل کنید.');return}try{let old=editId?products.find(p=>p.id===editId):null,image_url=old?.image_url||null,file=$('ePhoto').files[0];if(file)image_url=await uploadPhoto(file);const row={name,price,category_id,description:$('eDesc').value.trim(),image_url,is_available:$('eAvailable').checked};const result=editId?await db.from('products').update(row).eq('id',editId):await db.from('products').insert(row);if(result.error)throw result.error;$('editor').close();await loadAdmin()}catch(e){console.error(e);alert('ذخیره انجام نشد؛ دسترسی‌ها و حجم عکس را بررسی کنید.')}};$('cancelEdit').onclick=()=>$('editor').close();loadPublic();
</script></body></html>
